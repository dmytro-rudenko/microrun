<title>microrun вхід A</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { bg:'var(--bg)', surface:'var(--surface)', field:'var(--field)', ink:'var(--ink)', mute:'var(--mute)', line:'var(--line)', accent:'var(--accent)', 'on-accent':'var(--on-accent)', prod:'var(--prod)', 'prod-soft':'var(--prod-soft)', ok:'var(--ok)' },
  fontFamily: { sans:['Inter','system-ui','sans-serif'], display:['"Space Grotesk"','Inter','system-ui','sans-serif'], mono:['"JetBrains Mono"','ui-monospace','monospace'] },
} } };
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Split 50/50: brand panel with branch → environments diagram, form on the right */
:root{--bg:#f4f6fa;--surface:#fff;--field:#f8fafc;--ink:#151a22;--mute:#5d6878;--line:#d9dfe8;--accent:#2f6feb;--on-accent:#fff;--ring:rgba(47,111,235,.22);--prod:#c62828;--prod-soft:#fdecea;--ok:#1a7f37;
  --p1:#10265c;--p2:#1d4fc4;--p-ink:#eaf0ff;--p-mute:#a9bcec;--p-line:rgba(255,255,255,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1218;--surface:#141b24;--field:#0f151c;--ink:#e6edf3;--mute:#8b96a5;--line:#283342;--accent:#58a6ff;--on-accent:#04121f;--ring:rgba(88,166,255,.25);--prod:#ff6b6b;--prod-soft:rgba(255,107,107,.12);--ok:#3fb950;--p1:#081633;--p2:#123a8f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1218;--surface:#141b24;--field:#0f151c;--ink:#e6edf3;--mute:#8b96a5;--line:#283342;--accent:#58a6ff;--on-accent:#04121f;--ring:rgba(88,166,255,.25);--prod:#ff6b6b;--prod-soft:rgba(255,107,107,.12);--ok:#3fb950;--p1:#081633;--p2:#123a8f;color-scheme:dark}
body{background:var(--bg);color:var(--ink)}
.panel{background:radial-gradient(120% 80% at 0% 0%,var(--p2),var(--p1) 70%)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}
.rel{animation:slide 6s ease-in-out infinite}
@keyframes slide{0%,15%{transform:translateX(0)}45%,100%{transform:translateX(212px)}}
@media (prefers-reduced-motion:reduce){.rel{animation:none}}
</style>

<div class="min-h-screen grid lg:grid-cols-2 font-sans">
  <aside class="panel hidden lg:flex flex-col justify-between p-12 text-[color:var(--p-ink)]">
    <div class="flex items-center gap-3">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="var(--p-ink)"/><path d="M9 21V11l7 6 7-6v10" stroke="var(--p1)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="font-display text-xl font-bold tracking-tight">microrun</span>
    </div>

    <svg viewBox="0 0 440 300" class="w-full max-w-[480px] mx-auto" role="img" aria-label="Гілки релізів ідуть у середовища dev, stage і prod">
      <g font-family="JetBrains Mono, monospace" font-size="11">
        <line x1="40" y1="70" x2="40" y2="250" stroke="var(--p-line)" stroke-width="2"/>
        <g fill="var(--p-ink)"><circle cx="40" cy="80" r="6"/><circle cx="40" cy="150" r="6" opacity=".7"/><circle cx="40" cy="220" r="6" opacity=".45"/></g>
        <g fill="var(--p-mute)"><text x="54" y="84">a3f9c21</text><text x="54" y="154">7be04d8</text><text x="54" y="224">19c6e5a</text></g>
        <path d="M110 80 C150 80 150 60 190 60 M110 150 H190 M110 220 C150 220 150 240 190 240" stroke="var(--p-line)" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
        <g>
          <rect x="190" y="34" width="220" height="52" rx="10" fill="rgba(255,255,255,.08)" stroke="var(--p-line)"/>
          <text x="206" y="56" fill="var(--p-ink)" font-weight="500">dev</text><text x="206" y="74" fill="var(--p-mute)">feature/billing</text>
          <circle cx="392" cy="52" r="5" fill="#3fb950"/>
          <rect x="190" y="124" width="220" height="52" rx="10" fill="rgba(255,255,255,.08)" stroke="var(--p-line)"/>
          <text x="206" y="146" fill="var(--p-ink)" font-weight="500">stage</text><text x="206" y="164" fill="var(--p-mute)">main</text>
          <circle cx="392" cy="142" r="5" fill="#3fb950"/>
          <rect x="190" y="214" width="220" height="52" rx="10" fill="rgba(255,107,107,.14)" stroke="#ff8a8a"/>
          <text x="206" y="236" fill="var(--p-ink)" font-weight="500">prod</text><text x="206" y="254" fill="var(--p-mute)">v1.8.2</text>
          <rect x="356" y="228" width="40" height="18" rx="4" fill="#ff6b6b"/><text x="363" y="241" fill="#fff" font-size="10" font-weight="500">PROD</text>
        </g>
        <g class="rel"><rect x="-6" y="141" width="12" height="18" rx="3" fill="#ffd166" transform="translate(40 0)"/></g>
      </g>
    </svg>

    <div class="max-w-md">
      <h2 class="font-display text-3xl font-bold leading-tight [text-wrap:balance]">Кожна гілка — у своєму середовищі.</h2>
      <p class="mt-3 text-[color:var(--p-mute)]">Релізи, відкати й очищення контейнерів на ваших серверах — з одного екрана.</p>
    </div>
  </aside>

  <main class="flex items-center justify-center py-12" style="padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))">
    <div class="w-full max-w-sm">
      <div class="lg:hidden flex items-center gap-2 mb-8 font-display text-xl font-bold">microrun</div>
      <h1 class="font-display text-2xl font-bold">Вхід</h1>
      <p class="mt-1 text-sm text-mute">Увійдіть, щоб керувати середовищами.</p>
      <form id="f" class="mt-8 flex flex-col gap-5" novalidate>
        <div id="err" hidden role="alert" class="rounded-lg border border-prod bg-prod-soft px-4 py-3 text-sm text-prod">Невірний логін або пароль.</div>
        <div class="flex flex-col gap-2">
          <label for="username" class="text-sm font-medium">Логін</label>
          <input id="username" name="username" autocomplete="username" required class="inp block w-full rounded-lg border border-line bg-field px-3.5 py-2.5 text-sm text-ink placeholder:text-mute transition" placeholder="admin">
        </div>
        <div class="flex flex-col gap-2">
          <label for="password" class="text-sm font-medium">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required class="inp block w-full rounded-lg border border-line bg-field px-3.5 py-2.5 text-sm text-ink placeholder:text-mute transition" placeholder="••••••••">
        </div>
        <button class="mt-1 rounded-lg bg-accent px-5 py-2.5 text-sm font-semibold text-on-accent hover:opacity-90 focus:outline-none focus:ring-4 focus:ring-[color:var(--ring)]">Увійти</button>
        <p class="text-xs text-mute">Демо: будь-який логін і пароль <code class="font-mono">demo</code>; інший пароль покаже помилку.</p>
      </form>
    </div>
  </main>
</div>
<script>
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const f=e.target,err=document.getElementById('err');
  for(const i of f.querySelectorAll('input')){i.classList.toggle('!border-prod',!i.value);}
  if([...f.querySelectorAll('input')].some(i=>!i.value))return;
  const bad=f.password.value!=='demo';err.hidden=!bad;f.password.classList.toggle('!border-prod',bad);if(!bad)f.querySelector('button').textContent='Вхід виконано ✓';});
</script>
