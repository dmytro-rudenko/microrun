<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C · Стан + майстер відкату</title>
<style>
:root{--bg:#fbfaf7;--ink:#222;--mute:#777;--line:#e7e3da;--side:#f1eee6;--accent:#3d5afe;--prod:#d32f2f;--ok:#2e7d32;--warn:#b26a00}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Georgia,'Iowan Old Style',serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--side);border-right:1px solid var(--line);padding:20px 12px;font-family:system-ui,sans-serif;font-size:14px}
nav .logo{font-weight:800;font-size:18px;padding:0 10px 16px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;margin-bottom:2px}
nav a.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)}nav a.prod{color:var(--prod);font-weight:700}
nav a .w{color:var(--prod)}nav .sep{border-top:1px solid var(--line);margin:12px 0}
nav .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}nav .dot.off{background:#bbb}
main{padding:32px 40px;max-width:980px}
.ui{font-family:system-ui,sans-serif}
.prodbar{background:var(--prod);color:#fff;font:600 12px system-ui;letter-spacing:.08em;padding:6px 12px;border-radius:6px;display:inline-block;margin-bottom:10px}
h1{font-size:30px;margin:0 0 4px;font-weight:600}.sub{color:var(--mute);font:13px system-ui;margin-bottom:24px}
.hero{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:28px}
.hero.prod{border:2px solid var(--prod)}
.hero .lbl{font:600 12px system-ui;color:var(--ok);text-transform:uppercase;letter-spacing:.06em}
.hero h2{margin:6px 0;font-size:22px;font-weight:500}.sha{font-family:ui-monospace,monospace;font-weight:700}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{font:600 14px system-ui;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{background:var(--prod);border-color:var(--prod);color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}
.alert{font:14px system-ui;border-left:4px solid var(--prod);background:#fdecea;padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:18px}
.alert.w{border-color:var(--warn);background:#fff4e0}
h3{font:600 13px system-ui;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:24px 0 10px}
.list .it{display:grid;grid-template-columns:110px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-family:system-ui;font-size:14px;align-items:start}
.list .it.expired{opacity:.45}
.pill{font:600 11px system-ui;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-active{background:#e6f4ea;color:var(--ok)}.p-available{background:#e8ecff;color:var(--accent)}.p-blocked{background:#fdecea;color:var(--prod)}.p-expired{background:#eee;color:#888}.p-failed{background:#fff4e0;color:var(--warn)}
.diff{font:12px ui-monospace,monospace;margin-top:4px}.diff .add{color:var(--ok)}.diff .drop{color:var(--prod)}.diff .warn{color:var(--warn)}
.mute{color:var(--mute);font-size:13px}
.stepper{display:flex;gap:0;margin:8px 0 28px;font:13px system-ui}.stepper div{flex:1;padding:8px 0;border-top:3px solid var(--line);color:var(--mute)}
.stepper div.on{border-color:var(--accent);color:var(--ink);font-weight:600}.stepper div.done{border-color:var(--ok);color:var(--ok)}
.target{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff;cursor:pointer;font-family:system-ui;font-size:14px}
.target:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,90,254,.12)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;font-family:system-ui;font-size:14px;margin-bottom:16px}
input[type=text]{font:16px ui-monospace,monospace;padding:10px;border:1px solid var(--line);border-radius:8px;width:260px}
.steps{list-style:none;padding:0;font:14px system-ui}.steps li{padding:5px 0;color:var(--mute)}.steps li.done{color:var(--ink)}.steps li.done::before{content:'✓  ';color:var(--ok)}
.rule{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;font:14px system-ui;align-items:flex-start}.rule .n{margin-left:auto;font-weight:700;font-size:16px}
table{width:100%;border-collapse:collapse;font:14px system-ui}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-size:12px}
@media (max-width:760px){body{grid-template-columns:1fr}nav{display:flex;overflow-x:auto;gap:4px;padding:8px}nav .logo,nav .sep{display:none}main{padding:20px 16px}.list .it{grid-template-columns:1fr}}
</style></head><body>
<nav id="nav"></nav><main id="app"></main>
<script src="../../shared/data.js"></script><script src="../../shared/flow.js"></script>
<script>
const $ = s => document.querySelector(s), app = $('#app');
const pill = s => `<span class="pill p-${s}">${MR.stateLabel[s]}</span>`;
const diff = r => r.diff.length ? `<div class="diff">${r.diff.map(x => `<div class="${x.k}">${x.k === 'add' ? '+' : x.k === 'drop' ? '−' : '!'} ${x.t}</div>`).join('')}</div>` : '';
function nav(cur) {
  $('#nav').innerHTML = `<div class="logo">microrun</div>${['production', 'stage', 'dev'].map(MR.env).map(e => `<a href="#/env/${e.id}" class="${cur === e.id ? 'on' : ''} ${e.prod ? 'prod' : ''}"><span>${e.name}${e.markerOk ? '' : ' <span class="w">⚠</span>'}</span><span class="dot ${e.agentOnline ? '' : 'off'}"></span></a>`).join('')}
  <div class="sep"></div><a href="#/history" class="${cur === 'history' ? 'on' : ''}">Історія</a><a href="#/">Налаштування</a>`;
}
function envPage(id) {
  const e = MR.env(id), a = e.releases.find(r => r.state === 'active'), ok = e.agentOnline && e.markerOk, avail = e.releases.filter(r => r.state === 'available');
  nav(id);
  app.innerHTML = `${e.prod ? '<div class="prodbar">PRODUCTION</div>' : ''}<h1>${e.name}</h1>
    <div class="sub">гілка ${e.branch} · ${e.server} · ${e.db} · вікно ${e.retentionLabel} · ${e.storage}</div>
    ${e.markerOk ? '' : `<div class="alert"><b>Невідповідність бази.</b> ${e.markerWarn}</div>`}
    ${e.agentOnline ? '' : '<div class="alert w">Агент офлайн з 14:31. Деплой і відкат недоступні.</div>'}
    <div class="hero ${e.prod ? 'prod' : ''}"><div class="lbl">● Зараз працює</div><h2><span class="sha">${a.sha}</span> ${a.msg}</h2>
      <div class="mute ui">${a.author} · викатано ${MR.fmtAgo(a.at)} · ${e.services.map(s => s.name + ' (' + s.strategy + ')').join(', ')}</div>${diff(a)}
      <div class="row" style="margin-top:16px"><button class="btn ${e.prod ? 'danger' : 'primary'}" ${ok && avail.length ? '' : 'disabled'} onclick="location.hash='#/rollback/${e.id}'">Відкотити…</button>
      <span class="mute ui">${avail.length} релізів доступно для відкату</span></div></div>
    <h3>Релізи</h3><div class="list">${e.releases.map(r => { const l = MR.left(e, r); return `<div class="it ${r.state}"><div><span class="sha">${r.sha}</span><div>${pill(r.state)}</div></div>
      <div>${r.msg}<div class="mute">${r.author} · ${MR.fmtDate(r.at)}</div>${diff(r)}${r.blockedNote ? `<div style="color:var(--prod)">${r.blockedNote}</div>` : ''}${r.failNote ? `<div style="color:var(--warn)">${r.failNote}</div>` : ''}</div>
      <div class="mute" style="text-align:right">${l ? `доступний ще<br><b style="color:var(--ink)">${l.label}</b>` : ''}</div></div>`; }).join('')}</div>`;
}
const stepper = n => `<div class="stepper">${['Ціль', 'Підтвердження', 'Виконання', 'Прибирання даних', 'Підсумок'].map((s, i) => `<div class="${i < n ? 'done' : i === n ? 'on' : ''}">${i + 1}. ${s}</div>`).join('')}</div>`;
function wizard(id) {
  const e = MR.env(id), a = e.releases.find(r => r.state === 'active'), avail = e.releases.filter(r => r.state === 'available');
  nav(id); let target = avail[0].sha;
  const s1 = () => {
    app.innerHTML = `${e.prod ? '<div class="prodbar">PRODUCTION</div>' : ''}<h1>Відкат ${e.name}</h1><div class="sub">з <span class="sha">${a.sha}</span></div>${stepper(0)}
      ${avail.map((r, i) => { const b = MR.newerThan(e, r.sha); return `<label class="target"><input type="radio" name="t" value="${r.sha}" ${i === 0 ? 'checked' : ''}><div><span class="sha">${r.sha}</span> ${r.msg}
        <div class="mute">${r.author} · ${MR.fmtDate(r.at)} · доступний ще ${MR.left(e, r).label}</div>
        <div class="mute">Буде заблоковано: ${b.map(x => `<span class="sha">${x.sha}</span>`).join(', ')}</div></div></label>`; }).join('')}
      <div class="row"><button class="btn" onclick="location.hash='#/env/${e.id}'">Скасувати</button><button class="btn primary" id="n">Далі</button></div>`;
    $('#n').onclick = () => { target = document.querySelector('input[name=t]:checked').value; s2(); };
  };
  const s2 = () => {
    const b = MR.newerThan(e, target);
    app.innerHTML = `${e.prod ? '<div class="prodbar">PRODUCTION</div>' : ''}<h1>Відкат ${e.name}</h1><div class="sub"><span class="sha">${a.sha}</span> → <span class="sha">${target}</span></div>${stepper(1)}
      <div class="card"><b>Що станеться</b><ul><li>Сервіси ${e.services.map(s => s.name).join(', ')} повернуться на образ <span class="sha">${target}</span> без простою.</li>
      <li>Схема БД не змінюється — нові колонки залишаться до contract.</li><li>Заблоковано: ${b.map(x => `<span class="sha">${x.sha}</span> ${x.msg}`).join('; ')}. Повторний деплой цих комітів відхилятиметься.</li>
      ${b.some(x => x.cleanup) ? '<li>Після відкату буде запропоновано прибирання даних (окремий крок, можна пропустити).</li>' : ''}</ul></div>
      ${e.prod ? `<div class="card">Введіть <b>${e.name}</b>, щоб підтвердити<br><input type="text" id="cf" autocomplete="off" style="margin-top:8px"></div>` : ''}
      <div class="row"><button class="btn" id="bk">Назад</button><button class="btn danger" id="go" ${e.prod ? 'disabled' : ''}>Відкотити зараз</button></div>`;
    $('#bk').onclick = s1; if (e.prod) $('#cf').oninput = ev => $('#go').disabled = ev.target.value !== e.name;
    $('#go').onclick = () => s3(b);
  };
  const s3 = b => {
    const steps = MRFlow.rollbackSteps(e, target);
    app.innerHTML = `${e.prod ? '<div class="prodbar">PRODUCTION</div>' : ''}<h1>Відкат виконується</h1><div class="sub"><span class="sha">${a.sha}</span> → <span class="sha">${target}</span></div>${stepper(2)}<div class="card"><ul class="steps">${steps.map(s => `<li>${s}</li>`).join('')}</ul></div><div id="after"></div>`;
    MRFlow.run(steps, i => app.querySelectorAll('.steps li')[i].className = 'done', secs => {
      MR.applyRollback(e, target); nav(e.id);
      const c = b.filter(x => x.cleanup);
      $('#after').innerHTML = `<p class="ui" style="color:var(--ok);font-weight:600">Відкат завершено за ${secs} с. Сервіс уже працює на ${target}.</p><button class="btn primary" id="nx">${c.length ? 'Далі: прибирання даних' : 'Підсумок'}</button>`;
      $('#nx').onclick = () => c.length ? s4(c[0].sha, secs) : s5(secs, null);
    });
  };
  const s4 = (sha, secs) => {
    app.innerHTML = `<h1>Прибирання даних</h1><div class="sub">правила з образу <span class="sha">${sha}</span> · cleanup --dry-run</div>${stepper(3)}
      ${MR.cleanupRules.map(r => `<label class="rule"><input type="checkbox" ${r.count ? 'checked' : 'disabled'} data-n="${r.count}"><div><b>${r.rule}</b><div class="mute">${r.description}</div></div><span class="n">${MRFlow.fmtN(r.count)}</span></label>`).join('')}
      <div class="row"><button class="btn" id="sk">Пропустити</button><button class="btn danger" id="ap"></button></div>`;
    const upd = () => { const n = [...app.querySelectorAll('.rule input:checked')].reduce((x, i) => x + +i.dataset.n, 0); $('#ap').textContent = `Видалити ${MRFlow.fmtN(n)} записів`; $('#ap').disabled = !n; };
    app.querySelectorAll('.rule input').forEach(i => i.onchange = upd); upd();
    $('#sk').onclick = () => s5(secs, null);
    $('#ap').onclick = () => s5(secs, MR.cleanupRules.filter((r, i) => app.querySelectorAll('.rule input')[i].checked));
  };
  const s5 = (secs, rules) => {
    app.innerHTML = `<h1>Готово</h1><div class="sub">${e.name}: активний реліз <span class="sha">${target}</span></div>${stepper(5)}
      <div class="card">Відкат: ${secs} с.<br>${rules ? rules.map(r => `${r.rule}: прогноз ${MRFlow.fmtN(r.count)}, видалено ${MRFlow.fmtN(r.count)}`).join('<br>') : 'Прибирання даних пропущено.'}</div>
      <button class="btn primary" onclick="location.hash='#/env/${e.id}'">До оточення</button>`;
  };
  s1();
}
function history() {
  nav('history');
  app.innerHTML = `<h1>Історія</h1><div class="sub">усі оточення</div><table><thead><tr><th>Коли</th><th>Оточення</th><th>Дія</th><th>З → на</th><th>Хто</th><th>Результат</th></tr></thead><tbody>
  ${MR.history.map(h => `<tr><td>${MR.fmtDate(h.at)}</td><td style="${h.env === 'production' ? 'color:var(--prod);font-weight:700' : ''}">${h.env}</td><td>${MR.kindLabel[h.kind]}</td><td class="sha">${h.from} → ${h.to}</td><td>${h.actor}</td>
  <td style="color:${h.status === 'ok' ? 'var(--ok)' : 'var(--prod)'}">${MR.statusLabel[h.status]}${h.status === 'ok' ? ' · ' + h.dur : ''}${h.reason ? `<div class="mute">${h.reason}</div>` : ''}</td></tr>`).join('')}</tbody></table>`;
}
function route() {
  const h = location.hash.slice(1) || '/env/production', p = h.split('/');
  if (p[1] === 'env') envPage(p[2]); else if (p[1] === 'rollback') wizard(p[2]); else if (p[1] === 'history') history(); else envPage('production');
}
addEventListener('hashchange', route); route();
</script></body></html>
