<meta charset="utf-8">
<title>Microrun environment list</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/*BASE*/
/* Layout: fixed-width searchable environment list on the left, the selected environment fills the right; phone shows one at a time. */
html, body { height: 100%; }
.shell { display: grid; grid-template-columns: 340px minmax(0, 1fr); height: 100%; }
.side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--surface); padding-left: env(safe-area-inset-left, 0px); }
.side-top { display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { font: 700 16px var(--f-mono); color: var(--ink); text-decoration: none; }
.logo i { color: var(--accent); font-style: normal; }
.brand-r { display: flex; gap: 6px; }
.brand .btn { padding: 6px 10px; font-size: 13px; text-decoration: none; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.seg .n { color: var(--mute); margin-left: 3px; }
.seg button[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.list { flex: 1; overflow-y: auto; min-height: 0; }
.grp { position: sticky; top: 0; z-index: 1; padding: 8px 14px 4px; font-size: 12px; font-weight: 600; color: var(--mute); background: var(--surface); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.grp.g-prod { color: var(--prod); }
.item { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
.item:hover { background: var(--sunk); }
.item[aria-current="page"] { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); box-shadow: inset 3px 0 0 var(--accent); }
.item .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .ag { color: var(--mute); font-size: 12px; white-space: nowrap; }
.item .sub { grid-column: 2 / -1; color: var(--mute); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub.w { color: var(--warn); } .item .sub.b { color: var(--prod); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.dot.warn { background: var(--warn); } .dot.bad { background: var(--prod); } .dot.off { background: transparent; border: 2px solid var(--warn); }
.none { padding: 24px 14px; color: var(--mute); }
.detail { overflow-y: auto; min-height: 0; padding-block: 22px 48px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.detail-in { max-width: 920px; }
.back { display: none; margin-bottom: 12px; text-decoration: none; }
.hello { color: var(--mute); max-width: 52ch; }
.hello h1 { font: 700 24px var(--f-display); color: var(--ink); margin: 0 0 8px; }
@media (min-width: 1500px) { .shell.with-panel { grid-template-columns: 340px minmax(0, 1fr) 440px; } .shell.with-panel .drawer { position: static; transform: none; visibility: visible; box-shadow: none; height: 100%; width: auto; } body .shell.with-panel main.detail { margin-right: 0; } }
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  .side { border-right: 0; padding-right: env(safe-area-inset-right, 0px); }
  .shell.has-env .side { display: none; }
  .shell:not(.has-env) .detail { display: none; }
  .detail { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .back { display: inline-block; }
}
</style>
<div class="shell" id="shell">
<nav class="side" aria-label="Environments"><div class="side-top"><div class="brand"><a class="logo" href="#"><i>▍</i>microrun</a><span class="brand-r"><select class="lang" aria-label="Language"><option>EN</option><option>UK</option><option>DE</option></select><a class="btn btn-primary" href="#">New environment</a></span></div>
<input class="search" id="q" type="search" aria-label="Search">
<div class="seg" id="seg"></div></div><div class="list" id="list"></div></nav>
<main class="detail" id="detail"><div class="detail-in" id="detail-in"></div></main>
<aside class="drawer" id="drawer" aria-label="Release"></aside>
</div>
<script>
/*DATA*/
(function () {
  const { C, fmt, esc, issues, envs } = MR;
  const { short, ago, num } = fmt;
  const shell = document.getElementById('shell');
  const list = document.getElementById('list');
  const seg = document.getElementById('seg');
  const q = document.getElementById('q');
  const detail = document.getElementById('detail-in');
  const drawer = document.getElementById('drawer');
  q.placeholder = C.search;
  let filter = 'all';
  let current = null;

  const FILTERS = [
    ['all', 'All', () => true],
    ['attn', 'Needs attention', (e) => issues(e).length > 0],
    ['prod', 'Production', (e) => e.stage === 'prod'],
    ['preview', 'Previews', (e) => e.stage === 'preview'],
  ];
  const GROUPS = [['attn', 'Needs attention'], ['prod', 'Production'], ['stage', 'Staging'], ['dev', 'Development'], ['preview', 'Previews']];
  const match = (e, t) => !t || e.name.includes(t) || e.branch.includes(t) || e.releases.some((r) => r.sha.startsWith(t));
  const groupOf = (e) => (issues(e).some((i) => i.kind !== 'offline') ? 'attn' : e.stage);

  function item(e) {
    const is = issues(e);
    const tone = is.some((i) => i.tone === 'bad') ? 'bad' : !e.online ? 'off' : is.length ? 'warn' : '';
    const sub = is.length ? `<span class="sub ${tone === 'bad' ? 'b' : 'w'}">${is.map((i) => i.text).join(' · ')}</span>` : `<span class="sub">${e.active ? `<span class="sha">${short(e.active.sha)}</span> ${esc(e.active.message)}` : C.noReleases}</span>`;
    return `<a class="item" href="#env-${e.id}"${current === e.id ? ' aria-current="page"' : ''}><span class="dot ${tone}"></span><span class="nm">${esc(e.name)}</span><span class="ag">${ago(e.last.at)}</span>${sub}</a>`;
  }

  function drawList() {
    const t = q.value.trim().toLowerCase();
    const base = envs.filter((e) => match(e, t));
    seg.innerHTML = FILTERS.map(([k, l, f]) => `<button type="button" data-f="${k}" aria-pressed="${filter === k}">${l}<span class="n num">${base.filter(f).length}</span></button>`).join('');
    seg.querySelectorAll('button').forEach((b) => (b.onclick = () => { filter = b.dataset.f; drawList(); }));
    const f = FILTERS.find((x) => x[0] === filter)[2];
    const shown = base.filter(f);
    if (!shown.length) { list.innerHTML = `<p class="none">${t ? C.noMatch(esc(t)) : 'Nothing here.'}</p>`; return; }
    list.innerHTML = GROUPS.map(([g, label]) => {
      const es = shown.filter((e) => groupOf(e) === g);
      return es.length ? `<div class="grp${g === 'prod' ? ' g-prod' : ''}"><span>${label}</span><span class="num">${es.length}</span></div>${es.map(item).join('')}` : '';
    }).join('');
  }

  function hello() {
    const bad = envs.filter((e) => issues(e).length).length;
    detail.innerHTML = `<div class="hello"><h1>${envs.length} environments</h1><p>${num(MR.total)} releases on ${MR.servers.length} servers. ${bad} environments need attention; they are listed first.</p><p>Pick an environment on the left, or press <kbd>/</kbd> to search by name, branch or commit.</p></div>`;
  }

  function route() {
    MR.closePanel(drawer);
    shell.classList.remove('with-panel');
    const h = location.hash.slice(1);
    const e = h.startsWith('env-') && envs.find((x) => x.id === h.slice(4));
    current = e ? e.id : null;
    shell.classList.toggle('has-env', !!e);
    drawList();
    if (!e) return hello();
    MR.mountEnv(detail, e, {
      top: '<a class="back" href="#">← All environments</a>',
      onRelease: (env, r, redraw) => { shell.classList.add('with-panel'); MR.openPanel(drawer, env, r, () => { redraw(); drawList(); }, () => shell.classList.remove('with-panel')); },
    });
    document.getElementById('detail').scrollTop = 0;
    list.querySelector('[aria-current]')?.scrollIntoView({ block: 'nearest' });
  }
  q.addEventListener('input', drawList);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { MR.closePanel(drawer); shell.classList.remove('with-panel'); } if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); } });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
