<meta charset="utf-8">
<title>Сторінка оточення B</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>/* Layout: the app's own tokens from packages/server/src/public/app.css; a board of env columns, then a single env page whose layout differs per variant */
:root{--bg:#f6f7f9;--panel:#fff;--card:#fff;--ink:#1b1f24;--mute:#6a737d;--line:#e1e4e8;--accent:#2f6feb;--on-accent:#fff;--prod:#c62828;--prod-soft:#fdecea;--ok:#1a7f37;--warn:#9a6700;--warn-soft:#fff8c5;--code:#f3f4f6;--shade:rgba(0,0,0,.12);--on-prod:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1419;--panel:#161c23;--card:#1c242d;--ink:#e6edf3;--mute:#8b949e;--line:#2d3640;--accent:#58a6ff;--on-accent:#04121f;--prod:#ff6b6b;--prod-soft:rgba(255,107,107,.12);--ok:#3fb950;--warn:#d29922;--warn-soft:rgba(210,153,34,.12);--code:#0f1419;--shade:rgba(0,0,0,.5);--on-prod:#fff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1419;--panel:#161c23;--card:#1c242d;--ink:#e6edf3;--mute:#8b949e;--line:#2d3640;--accent:#58a6ff;--on-accent:#04121f;--prod:#ff6b6b;--prod-soft:rgba(255,107,107,.12);--ok:#3fb950;--warn:#d29922;--warn-soft:rgba(210,153,34,.12);--code:#0f1419;--shade:rgba(0,0,0,.5);--on-prod:#fff;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100%}
header{display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header b{font-size:16px;margin-right:12px;cursor:pointer}
header .sp{flex:1}
header select{width:auto;font:inherit;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.proto-note{font-size:12px;color:var(--mute);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--code);border-bottom:1px solid var(--line)}
main{padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;transition:margin .2s}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.col.prod{border:2px solid var(--prod);box-shadow:0 0 0 4px var(--prod-soft)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ch h2{margin:0;font-size:18px}
.ch h2 a{color:inherit;text-decoration:none}
.ch h2 a:hover{text-decoration:underline}
.meta{color:var(--mute);font-size:12px;margin:4px 0 12px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.04em;background:var(--prod);color:var(--on-prod)}
.agent{color:var(--ok)}
.agent.off{color:var(--mute)}
.tl{position:relative;padding-left:18px}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.rel{position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;cursor:pointer}
.rel:hover,.rel:focus-visible{border-color:var(--accent)}
.rel::before{content:'';position:absolute;left:-18px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--line);border:2px solid var(--panel)}
.rel.active{border-color:var(--ok)}
.rel.active::before{background:var(--ok)}
.rel.available::before{background:var(--accent)}
.rel.blocked::before{background:var(--prod)}
.rel.failed::before{background:var(--warn)}
.rel.expired{opacity:.5}
.sha{font-family:ui-monospace,monospace;font-weight:700}
.st{float:right;font-size:11px;color:var(--mute)}
.rel.active .st{color:var(--ok)}
.rel.blocked .st{color:var(--prod)}
.rel.failed .st{color:var(--warn)}
.small{font-size:12px;color:var(--mute)}
.more{margin-top:4px}
.ok{color:var(--ok);font-weight:600}
.bad{color:var(--prod)}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.alert{border:1px solid var(--prod);background:var(--prod-soft);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.alert.ok{border-color:var(--ok);background:var(--code);font-weight:400;color:var(--ink)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.b-active{color:var(--ok)}
.b-available{color:var(--accent)}
.b-blocked{color:var(--prod);background:var(--prod-soft)}
.b-expired{color:var(--mute)}
.b-failed{color:var(--warn);background:var(--warn-soft)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
th{font-size:12px;color:var(--mute);font-weight:600}
tr.click{cursor:pointer}
tr.click:hover td,tr.click:focus-visible td{background:var(--bg)}
tr.dim td{color:var(--mute)}
.diff{font-family:ui-monospace,monospace;font-size:12px}
.diff .add{color:var(--ok)}
.diff .drop{color:var(--prod)}
h1{font-size:22px;margin:8px 0 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h3{font-size:15px;margin:0 0 10px}
.sub{color:var(--mute);font-size:13px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:4px 14px}
.sub{overflow-wrap:anywhere}
td{overflow-wrap:break-word}
td.when,td.sha{white-space:nowrap}
a{color:var(--accent)}
a.back{text-decoration:none}
button{font:inherit;padding:6px 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.danger{background:var(--prod);border-color:var(--prod);color:var(--on-prod);font-weight:600}
button:focus-visible,a:focus-visible,tr.click:focus-visible,.rel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.block{margin-top:24px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.block-h h2{font-size:17px;margin:0}
/* settings form */
.envform{display:grid;gap:16px;max-width:760px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;margin:0;background:var(--panel);min-width:0;display:grid;gap:10px}
legend{font-weight:600;padding:0 6px}
label.f{display:grid;gap:4px}
label.f>span{font-size:12px;color:var(--mute);font-weight:600}
label.f small{color:var(--mute);font-size:12px}
input[type=text],input[type=number],select,textarea{font:inherit;width:100%;padding:7px 8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.inline{display:flex;gap:8px}
.inline>*{min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.srv{display:grid;gap:8px;border:1px dashed var(--line);border-radius:8px;padding:10px}
.srv-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.srv-line select{flex:1;min-width:160px;width:auto}
.srv-meta{font-size:12px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.srv-meta select{width:auto;padding:3px 6px;font-size:12px}
.newsrv{display:grid;gap:8px;background:var(--bg);border-radius:8px;padding:10px}
pre,code.tok{font-family:ui-monospace,monospace;font-size:12px;background:var(--code);border-radius:6px;padding:8px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.saved{color:var(--ok);font-size:13px}
/* release side panel */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);visibility:hidden;transition:transform .2s,visibility .2s;overflow-y:auto;z-index:6;box-shadow:-10px 0 30px var(--shade);padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
#panel.open{transform:none;visibility:visible}
#panel.prod{border-left:4px solid var(--prod)}
.x{float:right;background:none;border:none;color:var(--mute);font-size:22px;padding:0 4px}
.sect{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.big{width:100%;padding:10px;border-radius:8px;border:none;font-weight:600;margin-top:12px;background:var(--accent);color:var(--on-accent)}
.big.prod{background:var(--prod);color:var(--on-prod)}
.big.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.ask{margin-top:12px;display:grid;gap:4px}
.ask .actions>button{flex:1}
@media (min-width:1100px){body.panel-open main{margin-right:440px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:900px){.cols{grid-template-columns:1fr}.col.prod{order:-1}.hide-sm{display:none}th,td{padding:8px}.row2{grid-template-columns:1fr}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:8px 14px;color:var(--mute);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs a:hover{color:var(--ink)}
.cnt{font-size:11px;background:var(--code);border-radius:99px;padding:0 6px;color:var(--mute)}
</style>
<div id="app"></div>
<aside id="panel" aria-live="polite"></aside>
<script>const H = 3600e3, D = 24 * H, NOW = Date.now();

const SERVERS = [
  { id: 's-local', name: 'local', builtin: true, online: true, version: '0.1.0', proxy: 'external' },
  { id: 's-edge1', name: 'edge-fra-1', builtin: false, online: true, version: '0.1.0', proxy: 'bundled' },
  { id: 's-edge2', name: 'edge-waw-2', builtin: false, online: false, version: null, proxy: 'external' },
];

const ENVS = [
  {
    id: 'dev', name: 'dev', prod: false, branch: 'develop', serverId: 's-local', retention: { v: 3, u: 'days' },
    compose: 'shop-dev', composeDir: '/srv/shop-dev', db: 'postgres://db-dev/shop', storage: 'local · /var/lib/microrun/images',
    services: 'api · rolling, web · recreate, worker · recreate', schemaCheck: 'post_check', health: 60,
    releases: [
      { id: 'd5', sha: 'e41b07c', msg: 'feat(cart): save cart between sessions', author: 'olena', at: NOW - 2 * H, state: 'active', diff: [['add', '+ carts.saved_at']] },
      { id: 'd4', sha: '9c3d2aa', msg: 'fix(api): retry the payment webhook', author: 'taras', at: NOW - 9 * H, state: 'available', left: 0.85, diff: [] },
      { id: 'd3', sha: '51f0e9b', msg: 'chore: bump node to 24', author: 'olena', at: NOW - 1.4 * D, state: 'available', left: 0.53, diff: [] },
    ],
    ops: [
      { at: NOW - 2 * H, kind: 'Деплой', from: '9c3d2aa', to: 'e41b07c', who: 'CI · github-actions', ok: true, s: 41 },
      { at: NOW - 9 * H, kind: 'Деплой', from: '51f0e9b', to: '9c3d2aa', who: 'CI · github-actions', ok: true, s: 38 },
    ],
  },
  {
    id: 'stage', name: 'stage', prod: false, branch: 'release', serverId: 's-edge1', retention: { v: 7, u: 'days' },
    compose: 'shop-stage', composeDir: '/srv/shop-stage', db: 'postgres://db-stage/shop', storage: 'registry · ghcr.io/acme/shop',
    services: 'api · rolling, web · rolling, worker · recreate', schemaCheck: 'post_check', health: 90,
    releases: [
      { id: 's4', sha: '9c3d2aa', msg: 'fix(api): retry the payment webhook', author: 'taras', at: NOW - 6 * H, state: 'active', diff: [] },
      { id: 's3', sha: 'a7e1f30', msg: 'feat(search): filter by brand', author: 'iryna', at: NOW - 2 * D, state: 'available', left: 0.71, diff: [['add', '+ products.brand_id']] },
      { id: 's2', sha: 'b20c911', msg: 'refactor: split the orders module', author: 'taras', at: NOW - 3 * D, state: 'failed', diff: [['drop', '− users.email']] },
    ],
    ops: [
      { at: NOW - 6 * H, kind: 'Деплой', from: 'a7e1f30', to: '9c3d2aa', who: 'CI · github-actions', ok: true, s: 52 },
      { at: NOW - 3 * D, kind: 'Деплой', from: 'a7e1f30', to: 'b20c911', who: 'CI · github-actions', ok: false, s: 12, why: 'Dry-run відхилив деплой: колонку users.email видалено.' },
    ],
  },
  {
    id: 'production', name: 'production', prod: true, branch: 'main', serverId: 's-edge1', retention: { v: 14, u: 'days' },
    compose: 'shop', composeDir: '/srv/shop', db: 'postgres://db-prod/shop', storage: 's3 · s3://acme-releases/shop',
    services: 'api · rolling, web · rolling, worker · recreate', schemaCheck: 'dry_run', health: 120,
    releases: [
      { id: 'p6', sha: '9c3d2aa', msg: 'fix(api): retry the payment webhook', author: 'taras', at: NOW - 3 * H, state: 'active', diff: [] },
      { id: 'p5', sha: 'a7e1f30', msg: 'feat(search): filter by brand', author: 'iryna', at: NOW - 1.5 * D, state: 'available', left: 0.89, diff: [['add', '+ products.brand_id']] },
      { id: 'p4', sha: '3f88d01', msg: 'feat(checkout): Apple Pay', author: 'olena', at: NOW - 4 * D, state: 'available', left: 0.71, diff: [['add', '+ payments.wallet']] },
      { id: 'p3', sha: 'c51aa74', msg: 'feat(orders): bulk export to CSV', author: 'iryna', at: NOW - 6 * D, state: 'blocked', diff: [['add', '+ exports (таблиця)']] },
      { id: 'p2', sha: '0de4b6f', msg: 'chore: rotate the session secret', author: 'taras', at: NOW - 19 * D, state: 'expired', diff: [] },
    ],
    ops: [
      { at: NOW - 3 * H, kind: 'Деплой', from: 'a7e1f30', to: '9c3d2aa', who: 'CI · github-actions', ok: true, s: 63 },
      { at: NOW - 1.5 * D, kind: 'Деплой', from: '3f88d01', to: 'a7e1f30', who: 'CI · github-actions', ok: true, s: 58 },
      { at: NOW - 5 * D, kind: 'Відкат', from: 'c51aa74', to: '3f88d01', who: 'адмін', ok: true, s: 19 },
      { at: NOW - 5 * D + 20 * 60e3, kind: 'Прибирання', from: 'c51aa74', to: 'c51aa74', who: 'адмін', ok: true, s: 4, why: 'exports_table: очікувалось 1 204, видалено 1 204' },
      { at: NOW - 6 * D, kind: 'Деплой', from: '3f88d01', to: 'c51aa74', who: 'CI · github-actions', ok: true, s: 61 },
      { at: NOW - 12 * D, kind: 'Деплой', from: '0de4b6f', to: '3f88d01', who: 'CI · github-actions', ok: false, s: 120, why: 'api: healthcheck не пройшов за 120 с' },
    ],
  },
];
const VARIANT = { letter: 'B', title: 'вкладки Релізи / Історія / Налаштування' };
const TABS = [['releases', 'Релізи'], ['history', 'Історія'], ['settings', 'Налаштування']];
function renderEnv(e, tab) {
  const t = tab || 'releases';
  const body = t === 'releases' ? releasesTable(e) : t === 'history' ? historyTable(e) : settingsForm(e);
  return `${envHead(e)}
<div class="tabs" role="tablist">${TABS.map(([k, l]) => `<a role="tab" aria-selected="${k === t}" class="${k === t ? 'on' : ''}" href="#env-${e.id}-${k}">${l}${k === 'releases' ? ` <span class="cnt">${e.releases.length}</span>` : k === 'history' ? ` <span class="cnt">${e.ops.length}</span>` : ''}</a>`).join('')}</div>
<div role="tabpanel">${body}</div>`;
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const rtf = new Intl.RelativeTimeFormat('uk', { numeric: 'auto' });
const ago = (t) => { const m = Math.round((t - NOW) / 60e3); return Math.abs(m) < 60 ? rtf.format(m, 'minute') : Math.abs(m) < 1440 ? rtf.format(Math.round(m / 60), 'hour') : rtf.format(Math.round(m / 1440), 'day'); };
const date = (t) => new Intl.DateTimeFormat('uk', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(t);
const STATE = { active: 'Активний', available: 'Доступний', blocked: 'Заблоковано', expired: 'Вікно минуло', failed: 'Не викатано' };
const UNITS = { hours: 'годин', days: 'днів', weeks: 'тижнів' };
const envById = (id) => ENVS.find((e) => e.id === id);
const srvById = (id) => SERVERS.find((s) => s.id === id);
const activeOf = (e) => e.releases.find((r) => r.state === 'active');
const leftText = (e, r) => r.left == null ? '' : `ще ${Math.round(r.left * e.retention.v)} ${UNITS[e.retention.u]}`;
const agentBadge = (e) => { const s = srvById(e.serverId); return s.online ? `<span class="agent">● агент онлайн</span>` : `<span class="agent off">○ агент офлайн</span>`; };
const prodTag = (e) => (e.prod ? '<span class="tag">PRODUCTION</span>' : '');
const diffView = (r) => r.diff.length ? `<div class="diff">${r.diff.map(([k, t]) => `<div class="${k}">${esc(t)}</div>`).join('')}</div>` : '<span class="small">без змін</span>';

let route = { view: 'board' };
let openRelease = null;
let flash = '';
let newToken = null;

function go(hash) { location.hash = hash; }
function parseHash() {
  const h = location.hash.slice(1);
  if (h === 'new') return { view: 'new' };
  const m = /^env-([a-z]+)(?:-(releases|history|settings))?$/.exec(h);
  return m && envById(m[1]) ? { view: 'env', envId: m[1], tab: m[2] || null } : { view: 'board' };
}

function header() {
  return `<header><b onclick="go('board')">microrun</b><span class="sp"></span>
<button class="primary" onclick="go('new')">+ Нове оточення</button>
<select aria-label="Мова" id="lang"><option>Українська</option><option>English</option></select></header>
<div class="proto-note">Прототип · варіант ${VARIANT.letter}: ${esc(VARIANT.title)}. Дані вигадані, нічого не зберігається.</div>`;
}

function board() {
  return `<div class="cols">${ENVS.map((e) => `<section class="col${e.prod ? ' prod' : ''}">
<div class="ch"><h2><a href="#env-${e.id}">${esc(e.name)}</a></h2>${prodTag(e)}</div>
<div class="meta">гілка ${esc(e.branch)} · вікно ${e.retention.v} ${UNITS[e.retention.u]} · ${agentBadge(e)}</div>
<div class="tl">${e.releases.map((r) => `<div class="rel ${r.state}" tabindex="0" role="button" onclick="openPanel('${e.id}','${r.id}')" onkeydown="if(event.key==='Enter')openPanel('${e.id}','${r.id}')">
<span class="st">${STATE[r.state]}</span><span class="sha">${r.sha}</span><div>${esc(r.msg)}</div>
<div class="small">${esc(r.author)} · ${ago(r.at)}${r.left != null ? ` · ${leftText(e, r)}` : ''}</div>${r.left != null ? `<div class="bar"><i style="width:${r.left * 100}%"></i></div>` : ''}</div>`).join('')}</div>
<div class="small more"><a href="#env-${e.id}">Відкрити оточення →</a>${VARIANT.boardSettings ? ` · <a href="#env-${e.id}-settings">Налаштування</a>` : ''}</div></section>`).join('')}</div>`;
}

function envHead(e) {
  const s = srvById(e.serverId);
  return `<a class="back" href="#board">← Усі оточення</a><h1>${esc(e.name)} ${prodTag(e)}</h1>
<div class="sub"><span>гілка ${esc(e.branch)}</span><span>сервер: ${esc(s.name)} (${s.builtin ? 'вбудований' : 'віддалений'}) ${agentBadge(e)}</span><span>вікно відкату: ${e.retention.v} ${UNITS[e.retention.u]}</span></div>`;
}

function releasesTable(e) {
  return `<div class="tw"><table><thead><tr><th>Реліз</th><th>Стан</th><th class="hide-sm">Зміни схеми</th><th>Вікно</th></tr></thead><tbody>
${e.releases.map((r) => `<tr class="click${r.state === 'expired' ? ' dim' : ''}" tabindex="0" onclick="openPanel('${e.id}','${r.id}')" onkeydown="if(event.key==='Enter')openPanel('${e.id}','${r.id}')">
<td><span class="sha">${r.sha}</span> ${esc(r.msg)}<div class="small">${esc(r.author)} · ${date(r.at)}</div></td>
<td><span class="badge b-${r.state}">${STATE[r.state]}</span></td><td class="hide-sm">${diffView(r)}</td>
<td>${r.left != null ? `${leftText(e, r)}<div class="bar"><i style="width:${r.left * 100}%"></i></div>` : '—'}</td></tr>`).join('')}</tbody></table></div>`;
}

function historyTable(e, limit) {
  if (!e.ops.length) return `<p class="small">Операцій ще не було.</p>`;
  const shown = limit ? e.ops.slice(0, limit) : e.ops;
  const more = limit && e.ops.length > limit ? `<button type="button" class="more-btn" onclick="this.closest('[data-hist]').outerHTML=historyBlock(envById('${e.id}'), 0)">Показати всі (${e.ops.length})</button>` : '';
  return `<div data-hist><div class="tw"><table><thead><tr><th>Коли</th><th>Дія</th><th>Звідки → куди</th><th class="hide-sm">Хто</th><th>Результат</th></tr></thead><tbody>
${shown.map((o) => `<tr><td class="when">${date(o.at)}</td><td>${o.kind}</td><td class="sha">${o.from} → ${o.to}</td><td class="hide-sm">${esc(o.who)}</td>
<td><span class="${o.ok ? 'ok' : 'bad'}">${o.ok ? 'Успішно' : 'Помилка'}</span> · ${o.s} с${o.why ? `<div class="small">${esc(o.why)}</div>` : ''}</td></tr>`).join('')}</tbody></table></div>${more}</div>`;
}
function historyBlock(e, limit) { return historyTable(e, limit); }

function serverBlock(e) {
  const cur = srvById(e.serverId);
  const opt = (s) => `<option value="${s.id}"${s.id === cur.id ? ' selected' : ''}>${esc(s.name)}${s.builtin ? ' (вбудований)' : ''}${s.online ? '' : ' — офлайн'}</option>`;
  return `<div class="srv" id="srv">
<div class="srv-line"><select id="server_id" name="server_id" aria-label="Сервер" onchange="pickServer('${e.id}', this.value)">${SERVERS.map(opt).join('')}</select>
<button type="button" onclick="toggleNewServer()">+ Додати сервер</button></div>
<div class="srv-meta"><span>${cur.online ? '<span class="agent">● онлайн</span>' : '<span class="agent off">○ офлайн</span>'}</span><span>агент ${cur.version ?? '—'}</span>
<label>проксі <select id="proxy_mode" onchange="setProxy('${cur.id}', this.value)">${['external', 'bundled'].map((m) => `<option${m === cur.proxy ? ' selected' : ''}>${m}</option>`).join('')}</select></label>
${cur.builtin ? '' : `<button type="button" onclick="reissue('${cur.id}')">Перевипустити токен агента</button>`}
<span class="small">Сервер спільний: ${ENVS.filter((x) => x.serverId === cur.id).map((x) => esc(x.name)).join(', ')}</span></div>
${newToken ? `<div class="alert ok" role="status"><div>Токен агента для <b>${esc(newToken.name)}</b>. Скопіюйте зараз: він показується лише один раз.</div>
<code class="tok">${newToken.token}</code><div class="small">Виконайте на сервері:</div><pre>npm i -g microrun &amp;&amp; MICRORUN_AGENT_TOKEN=${newToken.token} microrun agent --url https://deploy.acme.dev</pre></div>` : ''}
<div class="newsrv" id="newsrv" hidden><label class="f"><span>Назва нового сервера</span><input type="text" id="newsrv-name" placeholder="edge-fra-2"></label>
<div class="actions"><button type="button" class="primary" onclick="createServer('${e.id}')">Створити й вибрати</button><button type="button" onclick="toggleNewServer()">Скасувати</button></div></div></div>`;
}

function settingsForm(e) {
  const v = e || { name: '', branch: '', prod: false, compose: '', composeDir: '', db: '', storage: 'local · /var/lib/microrun/images', services: '', schemaCheck: 'post_check', health: 60, retention: { v: 7, u: 'days' }, serverId: 's-local', id: 'new' };
  return `<form class="envform" onsubmit="event.preventDefault();saved()">
<fieldset><legend>Загальне</legend>
<div class="row2"><label class="f"><span>Назва</span><input type="text" id="f-name" value="${esc(v.name)}"></label>
<label class="f"><span>Гілка</span><input type="text" id="f-branch" value="${esc(v.branch)}"></label></div>
<label class="f"><span><input type="checkbox" id="f-prod"${v.prod ? ' checked' : ''}> Production</span><small>Production питає «Ви впевнені?» перед відкатом і вмикає dry-run міграцій.</small></label></fieldset>
<fieldset><legend>Сервер і агент</legend>${serverBlock(v)}</fieldset>
<fieldset><legend>Compose</legend>
<div class="row2"><label class="f"><span>Проєкт</span><input type="text" id="f-compose" value="${esc(v.compose)}"></label>
<label class="f"><span>Каталог</span><input type="text" id="f-dir" value="${esc(v.composeDir)}"></label></div>
<label class="f"><span>Сервіси й стратегії</span><input type="text" id="f-svc" value="${esc(v.services)}"></label>
<label class="f"><span>Healthcheck, с</span><input type="number" id="f-health" value="${v.health}"></label></fieldset>
<fieldset><legend>База даних</legend>
<label class="f"><span>Підключення</span><input type="text" id="f-db" value="${esc(v.db)}"></label>
<label class="f"><span>Перевірка схеми</span><select id="f-check"><option${v.schemaCheck === 'dry_run' ? ' selected' : ''} value="dry_run">dry-run перед деплоєм</option><option${v.schemaCheck === 'post_check' ? ' selected' : ''} value="post_check">перевірка після деплою</option></select></label></fieldset>
<fieldset><legend>Сховище образів і вікно відкату</legend>
<label class="f"><span>Сховище</span><input type="text" id="f-storage" value="${esc(v.storage)}"></label>
<label class="f"><span>Вікно відкату</span><span class="inline"><input type="number" id="f-ret" value="${v.retention.v}" style="max-width:110px"><select id="f-unit" style="max-width:140px">${Object.entries(UNITS).map(([k, t]) => `<option value="${k}"${k === v.retention.u ? ' selected' : ''}>${t}</option>`).join('')}</select></span><small>Скільки попередні збірки лишаються доступними для відкату. Не менше 1 години.</small></label></fieldset>
<div class="actions"><button type="submit" class="primary">${e ? 'Зберегти' : 'Створити оточення'}</button>${flash ? `<span class="saved" role="status">${flash}</span>` : ''}</div>
</form>`;
}

function panel(e, r) {
  const cur = activeOf(e);
  let target = null, mode = null;
  if (r.state === 'available') { target = r; mode = 'switch'; }
  if (r.state === 'active') { target = e.releases.filter((x) => x.state === 'available')[0] || null; mode = 'rollback'; }
  const label = mode === 'switch' ? 'Перейти на цю збірку' : 'Відкотити';
  const action = target ? `<div class="sect"><b>${mode === 'switch' ? 'Перейти' : 'Відкотити'} ${cur.sha} → ${target.sha}</b>
<div class="small">Схема БД не змінюється. Дані в існуючих полях зберігаються.</div>
${e.prod ? `<button class="big prod" id="go" onclick="this.hidden=true;document.getElementById('ask').hidden=false">${label}</button>
<div class="ask" id="ask" hidden><b>Ви впевнені?</b><div class="actions"><button class="big prod" onclick="doneAction('${label}')">Так</button><button class="big ghost" onclick="document.getElementById('ask').hidden=true;document.getElementById('go').hidden=false">Ні</button></div></div>`
    : `<button class="big" onclick="doneAction('${label}')">${label}</button>`}</div>` : '';
  return `<button class="x" onclick="closePanel()" aria-label="Закрити">×</button>
<div class="small">${esc(e.name)} ${prodTag(e)}</div>
<h2><span class="sha">${r.sha}</span> <span class="badge b-${r.state}">${STATE[r.state]}</span></h2><div>${esc(r.msg)}</div>
<div class="small">${esc(r.author)} · ${date(r.at)}</div><div class="small" style="margin-top:10px">Зміни схеми</div>${diffView(r)}${action}`;
}

function openPanel(envId, relId) { openRelease = { envId, relId }; renderPanel(); }
function closePanel() { openRelease = null; renderPanel(); }
function renderPanel() {
  const p = document.getElementById('panel');
  if (!openRelease) { p.className = ''; p.innerHTML = ''; document.body.classList.remove('panel-open'); return; }
  const e = envById(openRelease.envId), r = e.releases.find((x) => x.id === openRelease.relId);
  p.className = 'open' + (e.prod ? ' prod' : '');
  p.innerHTML = panel(e, r);
  document.body.classList.add('panel-open');
}
function doneAction(label) { document.getElementById('panel').querySelector('.sect').innerHTML = `<p class="ok">${label}: виконано за 19 с (імітація).</p>`; }

function pickServer(envId, id) { const e = envById(envId); if (e) e.serverId = id; else draft.serverId = id; newToken = null; rerenderServer(envId); }
function setProxy(id, m) { srvById(id).proxy = m; }
function reissue(id) { const s = srvById(id); newToken = { name: s.name, token: 'mra_' + Math.random().toString(36).slice(2, 14) }; rerenderServer(currentEnvId()); }
function toggleNewServer() { const n = document.getElementById('newsrv'); n.hidden = !n.hidden; if (!n.hidden) document.getElementById('newsrv-name').focus(); }
function createServer(envId) {
  const name = document.getElementById('newsrv-name').value.trim();
  if (!name) { document.getElementById('newsrv-name').focus(); return; }
  const s = { id: 's-' + name, name, builtin: false, online: false, version: null, proxy: 'external' };
  SERVERS.push(s);
  pickServer(envId, s.id);
  newToken = { name, token: 'mra_' + Math.random().toString(36).slice(2, 14) };
  rerenderServer(envId);
}
const draft = { serverId: 's-local', retention: { v: 7, u: 'days' } };
function currentEnvId() { return route.view === 'env' ? route.envId : 'new'; }
function rerenderServer(envId) {
  const e = envById(envId) || Object.assign({ id: 'new' }, draft);
  document.getElementById('srv').outerHTML = serverBlock(e);
}
function saved() { flash = 'Збережено'; render(); setTimeout(() => { flash = ''; }, 0); }

function render() {
  route = parseHash();
  const e = route.view === 'env' ? envById(route.envId) : null;
  const body = route.view === 'board' ? board()
    : route.view === 'new' ? `<a class="back" href="#board">← Усі оточення</a><h1>Нове оточення</h1><div class="sub">Релізи й історія з'являться після першого деплою.</div>${settingsForm(null)}`
    : renderEnv(e, route.tab);
  document.getElementById('app').innerHTML = header() + `<main>${body}</main>`;
  if (typeof afterRender === 'function') afterRender(e);
}
window.addEventListener('hashchange', () => { newToken = null; closePanel(); window.scrollTo(0, 0); render(); });
window.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { if (typeof closeDrawer === 'function') closeDrawer(); closePanel(); } });

render();</script>
